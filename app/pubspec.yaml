name: nexus
description: Nexus PPM Platform v2 — Multi-tenant Project Portfolio Management
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # Supabase
  supabase_flutter: ^2.8.0

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Routing
  go_router: ^14.6.0

  # Models & Serialization
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # UI & Layout
  flutter_adaptive_scaffold: ^0.2.4
  google_fonts: ^6.2.1

  # Charts
  fl_chart: ^0.69.0

  # Data Tables
  data_table_2: ^2.5.15

  # Date & Formatting
  intl: ^0.19.0

  # Local Storage
  shared_preferences: ^2.3.3

  # Utilities
  url_strategy: ^0.3.0
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code Generation
  riverpod_generator: ^2.6.2
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  build_runner: ^2.4.12

  # Linting
  flutter_lints: ^4.0.0

  # Testing
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
